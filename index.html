<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>İyi ki Doğdun Beyza</title>

    <style>
        /* TEMEL AYARLAR & RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #050304; 
            --text-main: #fdfbf7;
            --text-muted: #a3a3a3;
            --accent: #8c2633;
            --gold: #d4af37;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Kaydırmayı tamamen kapatır */
        }

        /* 1. GİRİŞ EKRANI (HEDİYENİ AÇ) */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: var(--bg-color);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        
        .btn-start {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold);
            padding: 15px 45px;
            border-radius: 30px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.2); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* 2. EKRAN ÇEVİR VİDEOSU EKRANI */
        #intro-video-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000;
            z-index: 900;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #ekrancevir-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 3. ANA YATAY SLAYT EKRANI */
        #slideshow-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            display: none;
            flex-direction: row; /* Ekranı yan yana böler */
            background: #080808;
            z-index: 800;
            opacity: 0;
            transition: opacity 1s ease;
            cursor: pointer;
        }

        /* SOL TARAF - FOTOĞRAF / VİDEO */
        .media-side {
            width: 50vw;
            height: 100dvh;
            position: relative;
            background: #080506;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        
        /* ÇÖZÜM: Medya kırpılmasını engelleyen yapı */
        .media-item {
            max-width: 90%; 
            max-height: 85dvh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.8s ease;
            filter: grayscale(10%) contrast(110%);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 15px rgba(140, 38, 51, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .media-item.active { opacity: 1; }

        /* SAĞ TARAF - YAZI VE KRALİYET DESENLERİ */
        .text-side {
            width: 50vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5%;
            background: radial-gradient(circle at center, #14080a 0%, #050304 100%);
            position: relative;
        }

        .text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
        }
        
        /* ⚜️ Desenleri CSS */
        .ornament {
            color: rgba(212, 175, 55, 0.3);
            font-size: 1.2rem;
            margin: 20px 0;
            letter-spacing: 10px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s ease;
        }
        .ornament.active {
            opacity: 1;
            transform: translateY(0);
        }
        .ornament span {
            font-size: 1.8rem;
            vertical-align: middle;
            margin: 0 10px;
        }

        /* Fotoğraf Sözleri CSS */
        .slide-text {
            font-family: "Georgia", serif;
            font-size: 1.5rem;
            line-height: 1.6;
            color: var(--text-main);
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .slide-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* GEÇMEK İÇİN BASINIZ YAZISI */
        .skip-hint {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1.5px;
            font-family: sans-serif;
            animation: pulseFade 2.5s infinite;
            pointer-events: none;
        }
        @keyframes pulseFade {
            0% { opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { opacity: 0.2; }
        }

        /* 4. MUM & FİNAL EKRANI (YATAY / YAN DÜZEN) */
        #candle-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: radial-gradient(circle at center, #1a0f12 0%, #050304 100%);
            z-index: 850;
            display: none;
            flex-direction: row; /* Dikeyden yataya geçirildi */
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        
        .candle-left, .candle-right {
            width: 50vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
            position: relative;
        }

        /* Mum Yazıları */
        #candle-texts {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 25px; /* Biraz aşağıya çekildi */
        }
        .fast-reveal {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            font-family: "Georgia", serif;
            font-size: 1.7rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .fast-reveal.active { opacity: 1; transform: translateY(0); }

        /* Zarif Mum Çizimi */
        .candle-container {
            position: relative;
            margin-top: 40px; /* Mum aşağıya çekildi */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .candle-stick {
            width: 25px;
            height: 120px;
            background: linear-gradient(to right, #d4d4d4, #fdfbf7, #b0b0b0);
            border-radius: 3px;
            position: relative;
        }
        .candle-flame {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 35px;
            background: #ff9d00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ff9d00, 0 0 30px #ff9d00, 0 0 50px #ff3700;
            animation: flicker 0.4s infinite alternate;
            cursor: pointer;
            z-index: 10;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.05) rotate(-2deg); opacity: 1; }
        }

        /* ÇÖZÜM: Veda Yazıları - Ekranın tamamını kaplayacak ve tam ortaya gelecek */
        #final-messages {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            display: none; /* Mumu üfleyince flex olacak */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
        }
        .final-text {
            font-family: "Georgia", serif;
            font-size: 2.2rem;
            color: var(--gold);
            opacity: 0;
            margin-bottom: 12px; /* Aralıklar daraltıldı, daha yukarıda/ortada duracak */
            transition: opacity 0.8s ease;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            text-align: center;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop></audio>

    <!-- 1. HEDİYENİ AÇ -->
    <div id="start-screen">
        <button class="btn-start" id="btn-start">Hediyeni Aç ❤️</button>
    </div>

    <!-- 2. EKRAN ÇEVİR -->
    <div id="intro-video-screen">
        <video id="ekrancevir-video" src="ekrancevir.mp4" playsinline></video>
    </div>

    <!-- 3. SLAYT EKRANI -->
    <div id="slideshow-screen">
        <div class="media-side" id="media-container"></div>
        <div class="text-side" id="text-container"></div>
    </div>

    <!-- 4. MUM VE FİNAL -->
    <div id="candle-screen">
        
        <!-- Sol Taraf: Mum Yazıları -->
        <div class="candle-left">
            <div id="candle-texts">
                <div class="fast-reveal" id="c-text-1">Ve şimdi...</div>
                <div class="fast-reveal" id="c-text-2">Gözlerini kapat.</div>
                <div class="fast-reveal" id="c-text-3">Bir dilek tut. ✨</div>
            </div>
        </div>

        <!-- Sağ Taraf: Mum -->
        <div class="candle-right">
            <div class="candle-container" id="candle-box">
                <div class="candle-flame" id="flame"></div>
                <div class="candle-stick"></div>
                <div style="margin-top: 25px; font-size: 0.85rem; color: #777;">Söndürmek için muma dokun</div>
            </div>
        </div>

        <!-- Mum Söndükten Sonra Ortada Çıkacak Veda Yazıları -->
        <div id="final-messages">
            <div class="final-text" id="f-text-1">İyi ki doğdun sevgilim.</div>
            <div class="final-text" id="f-text-2">İyi ki varsın.</div>
            <div class="final-text" id="f-text-3">Seni çok seviyorum. ❤️</div>
            <div class="final-text" id="f-text-4" style="font-size: 1.2rem; color: #a3a3a3; margin-top: 30px;">— Onur</div>
        </div>
        
    </div>

    <script>
        /* =========================================================================
           ================= YAZILARI BURADAN DEĞİŞTİR =============================
           Aşağıdaki 'text:' kısımlarının içindeki metinleri kendi istediğin 
           sözlerle dilediğin gibi değiştirebilirsin. Tırnak işaretlerini (" ") 
           silmemeye dikkat et.
           ========================================================================= */
        
        const slideData = [
            // --- 1. BÖLÜM (Foto 1-7 | Müzik 1 Çalar) ---
            { type: 'image', src: 'foto1.jpg', music: 'muzik1.mp3', text: 'Bilmiyordum ama o gün attığım mesaj, hayatımın en güzel başlangıçlarından biriymiş.' },
            { type: 'image', src: 'foto2.jpg', music: 'muzik1.mp3', text: 'İlk buluşmamızın küçücük bir hatırası, benim için kocaman bir anıya dönüştü.' },
            { type: 'image', src: 'foto3.jpg', music: 'muzik1.mp3', text: 'Sana verdiğim her çiçekte, sana olan sevgimin birazını anlatmaya çalışıyorum.' },
            { type: 'image', src: 'foto4.jpg', music: 'muzik1.mp3', text: 'İlk çiçeğimizi beraber yaptık, ama benim için en güzeli onun seninle yapılmış olmasıydı' },
            { type: 'image', src: 'foto5.jpg', music: 'muzik1.mp3', text: 'Birlikte yaptığımız her şeyin ayrı bir güzelliği var, tıpkı senin gibi.' },
            { type: 'image', src: 'foto6.jpg', music: 'muzik1.mp3', text: 'Seninle sıradan bir şeyi bile beraber yaptığımızda, benim için güzel bir anıya dönüşüyor"' },
            { type: 'image', src: 'foto7.jpg', music: 'muzik1.mp3', text: 'Belki küçük bir kaktüs, ama arkasında beraber geçirdiğimiz güzel bir an var. ❤️' },
            
            // --- 2. BÖLÜM (Ara Video & Foto 8-15 | Müzik 2 Çalar) ---
            { type: 'video', src: 'video1.mp4', music: 'muzik1.mp3', text: 'Sen benim en güzel tesadüfüm, en kıymetli kararımsın...' },
            
            { type: 'image', src: 'foto8.jpg', music: 'muzik1.mp3', text: 'Senin en güzel hallerinden biri de hiçbir şeyden habersiz, kendi halinde mutlu olduğun anlar.' },
            { type: 'image', src: 'foto9.jpg', music: 'muzik1.mp3', text: 'Aynı tişörtleri giydiğimiz gün, çocukça bir şey yapmanın bile seninle ne kadar güzel olduğunu anladım. 🕷️❤️' },
            { type: 'image', src: 'foto10.jpg', music: 'muzik1.mp3', text: 'Seni çizerken fark ettim; seni kağıda sığdırmak kolaymış da, sana olan sevgimi hiçbir yere sığdırmak mümkün değilmiş.' },
            { type: 'image', src: 'foto11.jpg', music: 'muzik1.mp3', text: 'Dört ay geçti ama sana baktığımda hâlâ ilk günkü gibi içim kıpır kıpır oluyor.' },
            { type: 'image', src: 'foto12.jpg', music: 'muzik1.mp3', text: 'Zaman geçiyor ama benim en sevdiğim zaman, seninle geçirdiğim zaman.' },
            { type: 'image', src: 'foto13.jpg', music: 'muzik1.mp3', text: 'Filmi hatırlamıyorum belki ama seninle yan yana olduğum o anı çok iyi hatırlıyorum' },
            { type: 'image', src: 'foto14.jpg', music: 'muzik1.mp3', text: 'Sana her yaklaştığımda dünyadaki bütün sesler biraz olsun susuyor gibi.' },
            { type: 'image', src: 'foto15.jpg', music: 'muzik1.mp3', text: 'Ve bu fotoğraf... Bizim hikâyemizin en güzel karelerinden biri. Daha nice fotoğrafa, nice anıya, nice ‘biz’lere. ❤️' },
            
            // --- 3. BÖLÜM (Son Video | Müzik 3 Çalar) ---
            { type: 'video', src: 'video2.mp4', music: 'muzik3.mp3', text: 'Ve bu hikaye daha yeni başlıyor sevgilim...' }
        ];
        /* ========================================================================= */


        /* =========================================
           SİSTEM ALTYAPISI (BURADAN AŞAĞISINA DOKUNMA)
           ========================================= */
        const startBtn = document.getElementById('btn-start');
        const startScreen = document.getElementById('start-screen');
        const introVideoScreen = document.getElementById('intro-video-screen');
        const ekrancevirVideo = document.getElementById('ekrancevir-video');
        
        const slideshowScreen = document.getElementById('slideshow-screen');
        const mediaContainer = document.getElementById('media-container');
        const textContainer = document.getElementById('text-container');
        const bgMusic = document.getElementById('bg-music');
        const candleScreen = document.getElementById('candle-screen');

        let currentSlide = 0;
        let slideInterval;
        let currentMusic = "";

        const placeholderImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='600'><rect width='100%' height='100%' fill='%231a1a1a'/><text x='50%' y='50%' fill='%23555' font-family='sans-serif' font-size='20' text-anchor='middle'>MEDYA BEKLENİYOR</text></svg>";

        /* BAŞLATMA */
        startBtn.addEventListener('click', () => {
            
            // === MOBİL SES KİLİDİ ÇÖZÜMÜ ===
            // Telefonlarda müziğin otomatik başlaması için, kullanıcı butona 
            // tıkladığı an sesi yükleyip çok kısa tetikliyoruz (kilidi kırıyoruz).
            bgMusic.src = slideData[0].music;
            bgMusic.load();
            bgMusic.play().then(() => {
                bgMusic.pause();
            }).catch(e => console.warn("Ses kilidi uyarısı (Önemsiz):", e));
            // ===============================

            startScreen.style.opacity = '0';
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                introVideoScreen.style.display = 'flex';
                
                let videoFailed = false;
                const playPromise = ekrancevirVideo.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("Ekrancevir videosu bulunamadı, siteye geçiliyor...");
                        videoFailed = true;
                        setTimeout(startMainSite, 2000); 
                    });
                }
                
                ekrancevirVideo.addEventListener('ended', () => {
                    if(!videoFailed) setTimeout(startMainSite, 3000);
                });

            }, 500);
        });

        function startMainSite() {
            introVideoScreen.style.display = 'none';
            slideshowScreen.style.display = 'flex';
            
            setTimeout(() => {
                slideshowScreen.style.opacity = '1';
                renderSlide(0);
                slideInterval = setInterval(nextSlide, 15000); 
            }, 100);
        }

        /* SLAYT YÜKLEME VE DOKUNARAK GEÇME */
        function renderSlide(index) {
            const data = slideData[index];
            
            // Müzik kontrol
            if (data.music !== currentMusic) {
                bgMusic.src = data.music;
                const mPromise = bgMusic.play();
                if(mPromise !== undefined) {
                    mPromise.catch(e => console.warn("Müzik bekleniyor:", data.music));
                }
                currentMusic = data.music;
            }

            // Medya Yükleme (Foto/Video)
            mediaContainer.innerHTML = ''; 
            let mediaEl;
            
            if (data.type === 'image') {
                mediaEl = document.createElement('img');
                mediaEl.src = data.src;
                mediaEl.onerror = function() { this.src = placeholderImg; };
                mediaEl.className = 'media-item';
            } else if (data.type === 'video') {
                mediaEl = document.createElement('video');
                mediaEl.src = data.src;
                mediaEl.className = 'media-item';
                mediaEl.autoplay = true;
                mediaEl.loop = true; 
                mediaEl.muted = true; 
                mediaEl.setAttribute('playsinline', '');
                mediaEl.onerror = function() { 
                    this.outerHTML = `<img src="${placeholderImg}" class="media-item active">`;
                };
            }
            mediaContainer.appendChild(mediaEl);

            // Yazı ve ⚜️ Desenlerini Yükleme
            textContainer.innerHTML = ''; 
            
            const textWrapper = document.createElement('div');
            textWrapper.className = 'text-wrapper';

            const topOrn = document.createElement('div');
            topOrn.className = 'ornament';
            topOrn.innerHTML = '❦ <span>⚜</span> ❦';

            const textEl = document.createElement('div');
            textEl.className = 'slide-text';
            textEl.textContent = data.text;

            const botOrn = document.createElement('div');
            botOrn.className = 'ornament';
            botOrn.style.transform = 'rotate(180deg)';
            botOrn.innerHTML = '❦ <span>⚜</span> ❦';

            textWrapper.appendChild(topOrn);
            textWrapper.appendChild(textEl);
            textWrapper.appendChild(botOrn);
            textContainer.appendChild(textWrapper);

            // Tıklayarak Geç Yazısı
            const skipHint = document.createElement('div');
            skipHint.className = 'skip-hint';
            skipHint.textContent = 'Geçmek için ekrana dokun 〉';
            textContainer.appendChild(skipHint);

            setTimeout(() => {
                const finalMedia = mediaContainer.querySelector('.media-item');
                if(finalMedia) finalMedia.classList.add('active');
                topOrn.classList.add('active');
                textEl.classList.add('active');
                botOrn.classList.add('active');
            }, 100); 
        }

        function nextSlide() {
            currentSlide++;
            
            if (currentSlide < slideData.length) {
                renderSlide(currentSlide);
            } else {
                clearInterval(slideInterval);
                startCandleScene();
            }
        }

        // Tıklayınca 15 Saniye beklemeden hemen geç (Skip)
        slideshowScreen.addEventListener('click', () => {
            clearInterval(slideInterval);
            nextSlide();
            if (currentSlide < slideData.length) {
                slideInterval = setInterval(nextSlide, 15000);
            }
        });

        /* MUM SÖNDÜRME VE FİNAL */
        function startCandleScene() {
            slideshowScreen.style.opacity = '0';
            setTimeout(() => {
                slideshowScreen.style.display = 'none';
                candleScreen.style.display = 'flex'; // Yatay moda geçer
                
                setTimeout(() => candleScreen.style.opacity = '1', 100);
                
                setTimeout(() => document.getElementById('c-text-1').classList.add('active'), 500);
                setTimeout(() => document.getElementById('c-text-2').classList.add('active'), 1500);
                setTimeout(() => document.getElementById('c-text-3').classList.add('active'), 2500);
                
            }, 1000);
        }

        const flame = document.getElementById('flame');
        flame.addEventListener('click', () => {
            flame.style.display = 'none'; 
            
            // Mum ve sağdaki-soldaki yazıları şeffaflaştır
            document.querySelector('.candle-left').style.opacity = '0';
            document.querySelector('.candle-right').style.opacity = '0';

            // Arka planı iyice karanlık yap
            candleScreen.style.background = "radial-gradient(circle, #100a0b 0%, #050304 100%)";

            setTimeout(() => {
                // Her şeyi ekrandan kaldır
                document.querySelector('.candle-left').style.display = 'none';
                document.querySelector('.candle-right').style.display = 'none';
                
                // Final veda yazılarını tüm ekranı kaplayacak şekilde aç
                const finalMsgs = document.getElementById('final-messages');
                finalMsgs.style.display = 'flex';
                
                setTimeout(() => document.getElementById('f-text-1').style.opacity = '1', 500);
                setTimeout(() => document.getElementById('f-text-2').style.opacity = '1', 2000);
                setTimeout(() => document.getElementById('f-text-3').style.opacity = '1', 3500);
                setTimeout(() => document.getElementById('f-text-4').style.opacity = '1', 5000);
            }, 1000);
        });
    </script>
</body>
</html>
